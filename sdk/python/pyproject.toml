[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "memoria-client"
version = "1.0.0"
description = "Official Python SDK for the Memoria memory engine REST API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "loveRhythm1990" }]
keywords = ["memoria", "memory", "ai", "agent", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.23",
    "anyio[trio]>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/matrixorigin/Memoria"
Repository = "https://github.com/matrixorigin/Memoria"

[tool.hatch.build.targets.wheel]
packages = ["src/memoria"]

[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
